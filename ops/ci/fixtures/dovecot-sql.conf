driver = pgsql
connect = host=127.0.0.1 dbname=mail user=mail password=ci-db-only
default_pass_scheme = PLAIN
password_query = SELECT userid AS user, password FROM users WHERE userid = '%u' AND active = 'Y'
user_query = SELECT '/var/mail/ci.invalid/probe' AS home, 'maildir:/var/mail/ci.invalid/probe' AS mail, 55004 AS uid, 55004 AS gid FROM users WHERE userid = '%u' AND active = 'Y'
