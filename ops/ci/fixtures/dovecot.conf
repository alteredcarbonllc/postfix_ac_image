protocols = imap pop3 lmtp
listen = *

auth_mechanisms = plain login
disable_plaintext_auth = yes
auth_verbose = yes
auth_debug = no
auth_debug_passwords = no
auth_verbose_passwords = no
mail_debug = no
verbose_ssl = no

log_path = /var/log/dovecot/dovecot.log

mail_uid = 55004
mail_gid = 55004
mail_privileged_group = vmail

passdb {
  driver = sql
  args = /etc/dovecot/ci-sql.conf
}
userdb {
  driver = sql
  args = /etc/dovecot/ci-sql.conf
}

namespace inbox {
  inbox = yes
  prefix =
  mailbox Drafts {
    special_use = \Drafts
  }
  mailbox Junk {
    special_use = \Junk
  }
  mailbox Sent {
    special_use = \Sent
  }
  mailbox "Sent Messages" {
    special_use = \Sent
  }
  mailbox Trash {
    special_use = \Trash
  }
}

ssl = required
ssl_cert = </tmp/ci/cert.pem
ssl_key = </tmp/ci/key.pem
ssl_min_protocol = TLSv1.3
ssl_cipher_list = ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
ssl_prefer_server_ciphers = yes
ssl_client_ca_dir = /etc/ssl/certs

service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service pop3-login {
  inet_listener pop3 {
    port = 0
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}

service auth {
  inet_listener auth {
    address = 127.0.0.1
    port = 40000
  }
}

service lmtp {
  inet_listener lmtp {
    address = 127.0.0.1
    port = 24
  }
}

protocol imap {
  postmaster_address = postmaster@ci.invalid
}
protocol lmtp {
  postmaster_address = postmaster@ci.invalid
}
